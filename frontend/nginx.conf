server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /backend/ {
        proxy_pass http://gitops-demo.gitops-demo.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
